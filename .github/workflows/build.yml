name: Build desktop packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Test
        run: npm test
      - name: Build installer and portable executable
        run: npm run pack:win
      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: ps5-lan-workbench-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Test
        run: npm test
      - name: Build DMG and ZIP
        run: npm run pack:mac
      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: ps5-lan-workbench-macos-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
